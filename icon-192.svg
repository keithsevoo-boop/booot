<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  
  <!-- Outer ethereal rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Neural orbit paths -->
  <ellipse cx="256" cy="256" rx="160" ry="90" fill="none" stroke="#67e8f9" stroke-width="1.5" opacity="0.35" transform="rotate(-25 256 256)"/>
  <ellipse cx="256" cy="256" rx="160" ry="90" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.35" transform="rotate(35 256 256)"/>
  <ellipse cx="256" cy="256" rx="140" ry="70" fill="none" stroke="#f472b6" stroke-width="1" opacity="0.25" transform="rotate(70 256 256)"/>
  
  <!-- Central core glow -->
  <circle cx="256" cy="256" r="68" fill="url(#coreGrad)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Inner core -->
  <circle cx="256" cy="256" r="42" fill="#0f172a" opacity="0.85"/>
  
  <!-- Mind / neural node -->
  <circle cx="256" cy="256" r="22" fill="url(#coreGrad)" filter="url(#softGlow)"/>
  
  <!-- Orbiting particles / nodes -->
  <circle cx="256" cy="120" r="8" fill="#22d3ee" filter="url(#softGlow)"/>
  <circle cx="380" cy="220" r="7" fill="#a78bfa" filter="url(#softGlow)"/>
  <circle cx="340" cy="360" r="6" fill="#f472b6" filter="url(#softGlow)"/>
  <circle cx="170" cy="350" r="7" fill="#67e8f9" filter="url(#softGlow)"/>
  <circle cx="140" cy="200" r="6" fill="#c084fc" filter="url(#softGlow)"/>
  
  <!-- Connecting neural lines -->
  <line x1="256" y1="256" x2="256" y2="120" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
  <line x1="256" y1="256" x2="380" y2="220" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
  <line x1="256" y1="256" x2="340" y2="360" stroke="#f472b6" stroke-width="1.5" opacity="0.45"/>
  <line x1="256" y1="256" x2="170" y2="350" stroke="#67e8f9" stroke-width="1.5" opacity="0.5"/>
  <line x1="256" y1="256" x2="140" y2="200" stroke="#c084fc" stroke-width="1.5" opacity="0.45"/>
  
  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="95" fill="none" stroke="url(#coreGrad)" stroke-width="1" opacity="0.25"/>
</svg>
